---
name: mlibrary-nebula
version: 3.0.0
author: MLibrary
summary: Central MLibrary module
license: BSD-3-Clause
source: https://github.com/mlibrary/nebula
dependencies:
  # examples:
  # add a module from a git repo (note: must also add this to control repo!)
  # - name: private_module
  #   repo: https://github.com/mlibrary/repo_name
  #   ref: some_git_ref # optional
  # # add a module from a puppet forge
  # - name: example/foobar
  #   version_requirement: ">= 10.1.0 < 11.0.0" # optional
  - name: jdowning/rbenv
  - name: puppet/archive
  - name: puppet/kmod
  - name: puppet/letsencrypt
  - name: puppet/logrotate
  - name: puppet/nginx
  - name: puppet/php
  - name: puppet/systemd
  - name: puppet/unattended_upgrades
  - name: puppetlabs/apache
  - name: puppetlabs/apt
    # 11 blocked by puppetlabs/docker
    version_requirement: ">= 10.0.1 < 11.0.0"
  - name: puppetlabs/augeas_core
  - name: puppetlabs/concat
  - name: puppetlabs/cron_core
  - name: puppetlabs/docker
  - name: puppetlabs/firewall
  - name: puppetlabs/host_core
  - name: puppetlabs/inifile
  - name: puppetlabs/lvm
  - name: puppetlabs/mount_core
  - name: puppetlabs/mysql
  - name: puppetlabs/reboot
  - name: puppetlabs/sshkeys_core
  - name: puppetlabs/stdlib
  - name: puppetlabs/vcsrepo
  - name: stm/debconf
operatingsystem_support:
  - operatingsystem: Debian
    operatingsystemrelease:
      - "11"
      - "12"
      - "13"
  - operatingsystem: Ubuntu
    operatingsystemrelease:
      - "22.04"
      - "24.04"
requirements:
  - name: puppet
    version_requirement: ">= 8.0.0 < 9.0.0"
