name: Run CI

on:
  push:
    branches: [$default-branch]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
        - "lint"
        - "all_roles_1"
        - "all_roles_2"
        - "classes"
        - "defines_and_functions"
        - "ht_profiles"
        - "ht_roles"
        - "profiles_1"
        - "profiles_2"
        - "roles"
    steps:
    - uses: actions/checkout@v5
    - name: Run tests
      run: |
        docker compose --file docker-compose.test.yml build
        docker compose --file docker-compose.test.yml run ${{ matrix.target }}
