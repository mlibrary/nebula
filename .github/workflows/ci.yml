name: Run CI

on:
  push:
    branches:
    - production
  pull_request:

jobs:
  setup_tests:
    name: _setup
    runs-on: ubuntu-latest
    outputs:
      filegroup: ${{ steps.define_matrix.outputs.filegroup }}
      os: ${{ steps.define_matrix.outputs.os }}
    steps:
    - uses: actions/checkout@v6
    - name: cache fixtures
      uses: actions/cache@v4
      id: cache-fixtures
      with:
        path: spec/fixtures/modules
        key: cache-fixtures-modules-${{ hashFiles('.fixtures.yml') }}
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: Define test matrix
      id: define_matrix
      run: bundle exec rake ci:matrix >> "$GITHUB_OUTPUT"
    - if: ${{ steps.cache-fixtures.outputs.cache-hit != 'true' }}
      name: rake spec_prep
      run: bundle exec rake spec_prep
  lint:
    name: "All OSes: lint"
    needs: setup_tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: lint with Standard Ruby style guide
      run: bundle exec standardrb
    - name: check Puppet syntax
      run: bundle exec rake syntax
    - name: Run puppet-lint
      run: bundle exec rake lint
    - name: lint metadata.json
      run: bundle exec rake metadata_lint
  spec:
    name: "${{ matrix.os }}: ${{ matrix.filegroup }}"
    needs: setup_tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        filegroup: ${{ fromJSON(needs.setup_tests.outputs.filegroup) }}
        os: ${{ fromJSON(needs.setup_tests.outputs.os) }}
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: Restore fixtures cache
      uses: actions/cache/restore@v4
      with:
        path: spec/fixtures/modules
        key: cache-fixtures-modules-${{ hashFiles('.fixtures.yml') }}
    - name: rake spec_prep
      run: bundle exec rake spec_prep
    - name: "Run SUPPORTED_OS=\"${{ matrix.os }}\" rake ci[${{ matrix.filegroup }}]"
      env:
        SUPPORTED_OS: ${{ matrix.os }}
      run: bundle exec rake ci[${{ matrix.filegroup }}]
