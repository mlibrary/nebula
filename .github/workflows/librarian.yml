name: Check Dependencies

on:
  push:
    branches:
    - production
  pull_request:
    paths:
    - metadata.json

jobs:
  librarian:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true
    - name: Resolve dependencies with librarian-puppet
      run: bundle exec librarian-puppet install --verbose
