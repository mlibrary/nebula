name: Run CI

on:
  push:
    branches: [$default-branch]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run tests
      run: |
        docker compose --file docker-compose.test.yml build
        docker compose --file docker-compose.test.yml run lint
