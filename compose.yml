services:
  specs:
    build: .
    command: 'bundle exec rake spec'
    volumes:
      - .:/app

  spec_prep:
    build: .
    command: 'bundle exec rake fixtures:prep'
    volumes:
      - .:/app

  lint:
    build: .
    command:
    - /bin/bash
    - '-c'
    - 'bundle exec rake validate && bundle exec rake lint'
    volumes:
      - .:/app
